name: Jev PoC verification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'examples/jev-poc/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/jev-poc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve execution identity
        run: |
          mkdir -p target/poc-evidence
          git rev-parse HEAD > target/poc-evidence/commit.txt
          git archive HEAD > target/poc-evidence/source.tar
          python3 --version > target/poc-evidence/python-version.txt
      - name: Native tests, formatting, and lint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show 2>&1 | tee target/poc-evidence/toolchain.log
          cargo fmt --all -- --check 2>&1 | tee target/poc-evidence/fmt.log
          cargo test --locked --all-targets 2>&1 | tee target/poc-evidence/cargo-test.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/poc-evidence/clippy.log
          cargo build --locked 2>&1 | tee target/poc-evidence/build.log
          cp target/debug/validator target/poc-evidence/validator
      - name: Example tests and recorded-output replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'jsonschema==4.25.1'
          python3 -m unittest discover -s examples/jev-poc -p 'test_*.py' -v 2>&1 | tee target/poc-evidence/example-tests.log
          python3 examples/jev-poc/poc.py verify --validator target/debug/validator --upstream examples/jev-poc/upstream --out target/poc-evidence/runs 2>&1 | tee target/poc-evidence/example-replay.log
          node --check examples/jev-poc/capture_sift.mjs
          node examples/jev-poc/capture_sift.mjs --book target/poc-evidence/runs/drafts/sift.json --limit 5 > target/poc-evidence/sift-dry-run.json
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-poc-evidence
          path: target/poc-evidence/
          if-no-files-found: error
          retention-days: 14

  native-runtimes:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve pinned public sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-runtimes
          while read -r name repository revision; do
            directory="target/native-runtimes/$name"
            git init -q "$directory"
            git -c credential.helper= -C "$directory" fetch --quiet --depth=1 "https://github.com/$repository.git" "$revision"
            git -C "$directory" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          done <<'PINS'
          router gargpratyush/jev-router 38da6b84ea01241bfc41fbddc0928d0f40a703f0
          sift kbhuw/jev-sift 966de12e2bb5f94d47886ee51f30a07ec8ef1607
          foreman thruwire/foreman a7d21d18d306a0cb9f3e15acefbdb5663521405c
          PINS
          npm ci --prefix target/native-runtimes/router --ignore-scripts --no-audit --no-fund
          npm ci --prefix target/native-runtimes/sift --ignore-scripts --no-audit --no-fund
          python3 -m pip install 'pydantic==2.13.4'
      - name: Obtain the verified native binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name jev-poc-evidence --dir target/native-core
          chmod 700 target/native-core/validator
      - name: Test original applications and native Validator, without inference
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/jev-poc/native/verify.py --sources target/native-runtimes --validator target/native-core/validator --out target/native-proof 2>&1 | tee target/native-proof.log
      - name: Sift capture-to-review worked example, without inference
        shell: bash
        run: |
          set -euo pipefail
          node examples/jev-poc/sift/test-capture.mjs target/native-runtimes/sift target/sift-capture-proof | tee target/sift-capture-proof.log
          python3 examples/jev-poc/sift/run.py compare --book target/sift-capture-proof/capture.json.book.json --capture target/sift-capture-proof/capture.json --validator target/native-core/validator --out target/sift-review-proof --fixture | tee target/sift-review-proof.log
      - name: Package source and dependency bytes for offline execution
        shell: bash
        run: |
          set -euo pipefail
          tar -czf target/native-runtimes.tar.gz -C target native-runtimes
          sha256sum target/native-runtimes.tar.gz > target/native-runtimes.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-native-runtimes
          path: |
            target/native-runtimes.tar.gz
            target/native-runtimes.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-application-proof
          path: |
            target/native-proof/
            target/native-proof.log
            target/sift-capture-proof/
            target/sift-capture-proof.log
            target/sift-review-proof/
            target/sift-review-proof.log
          if-no-files-found: error
          retention-days: 14
