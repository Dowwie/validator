# Temporary file transfer: create verified Git blobs only, never update a branch.
# Removed after the connector verifies and publishes the locally tested tree.
name: Stage tested portfolio files once
on:
  push:
    branches: ['examples/jev-poc-execution']
    paths: ['.github/workflows/portfolio-stage-once.yml']
permissions:
  contents: read
jobs:
  blobs:
    if: github.repository == 'Dowwie/validator' && github.ref == 'refs/heads/examples/jev-poc-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check exact tested patch and create source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,re,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Dowwie/validator'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='4209d39bb6fbda748a86878166a6751f6c8729fc'
          compressed=base64.b64decode(''.join(pathlib.Path(f'.portfolio-transfer/{i}').read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='dd91db3c6b9c52ee05fd34a1121e68e540b3388a3d072e20ebebb36c0ec06138'
          patch=lzma.decompress(compressed,memlimit=128*1024*1024)
          assert len(patch)==131531
          assert hashlib.sha256(patch).hexdigest()=='55b90cddbd71cd370142fd71c031ecc96b04460831eec7f7565e0884d4e4ae65'
          allowed={'.github/workflows/portfolio.yml','docs/acceptance/portfolio-expansion.md','docs/artifact-index.md','examples/jev-poc/PORTFOLIO.md','examples/jev-poc/README.md','examples/jev-poc/portfolio/README.md','examples/jev-poc/portfolio/moderation.package-lock.json','examples/jev-poc/portfolio/moderation.package.json','examples/jev-poc/portfolio/native-cases.json','examples/jev-poc/portfolio/native.mjs','examples/jev-poc/portfolio/outcomes.json','examples/jev-poc/portfolio/rubric.json','examples/jev-poc/portfolio/run.py','examples/jev-poc/portfolio/sources.json','examples/jev-poc/portfolio/tasks.py','examples/jev-poc/portfolio/test_portfolio.py'}
          assert set(re.findall(r'^diff --git a/(\S+) b/\S+$',patch.decode(),re.M))==allowed
          pathlib.Path('/tmp/portfolio-tested.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','/tmp/portfolio-tested.patch'],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','/tmp/portfolio-tested.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          result={}
          for name in sorted(allowed):
              path=pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              data=path.read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/Dowwie/validator/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'validator-tested-file-transfer'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  blob=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob['sha']==expected
              result[name]={'sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path('changed-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-tested-file-blobs
          path: changed-blobs.json
          if-no-files-found: error
          retention-days: 7
