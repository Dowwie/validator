# Temporary, hash-bound file transfer. Creates Git blobs only; never updates refs.
# Removed after the connector verifies and publishes the exact locally tested tree.
name: Stage Made with Jev files once
on:
  push:
    branches: ['examples/jev-poc-execution']
    paths: ['.github/workflows/made-publish-once.yml']
permissions:
  contents: read
jobs:
  blobs:
    if: github.repository == 'Dowwie/validator' && github.ref == 'refs/heads/examples/jev-poc-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact tested patch and create changed-file blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,re,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Dowwie/validator'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='c905826091cb460bd340603e4e1e4b37520c1b59'
          compressed=base64.b64decode(''.join(pathlib.Path(f'.made-transfer/{i}').read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='8fd37ebd816eb1f3ab4ecdae3c73926d312e44ec7f86a0ec3b8e7803a0c27249'
          patch=lzma.decompress(compressed,memlimit=128*1024*1024)
          assert len(patch)==417836
          assert hashlib.sha256(patch).hexdigest()=='1ebc3b557a587d244a29e16ebfa19892d1f685aace8fcc4b8262a51b26919f80'
          allowed={'.github/workflows/made-with-jev.yml','docs/acceptance/made-with-jev.md','docs/artifact-index.md','examples/jev-poc/madewithjev/README.md','examples/jev-poc/madewithjev/audit_probabilities.py','examples/jev-poc/madewithjev/clean-fixtures.json','examples/jev-poc/madewithjev/clean-questions.mjs','examples/jev-poc/madewithjev/clean-reference-proposals.json','examples/jev-poc/madewithjev/fetch.py','examples/jev-poc/madewithjev/oracle.py','examples/jev-poc/madewithjev/outcomes.json','examples/jev-poc/madewithjev/pins.json','examples/jev-poc/madewithjev/record.py','examples/jev-poc/madewithjev/review.py','examples/jev-poc/madewithjev/rubric.json','examples/jev-poc/madewithjev/run.py','examples/jev-poc/madewithjev/test_made.py'}
          assert set(re.findall(r'^diff --git a/(\S+) b/\S+$',patch.decode(),re.M))==allowed
          pathlib.Path('/tmp/made-tested.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','/tmp/made-tested.patch'],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','/tmp/made-tested.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          result={}
          for name in sorted(allowed):
              file=pathlib.Path(name)
              assert not file.is_symlink()
              data=file.read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/Dowwie/validator/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'validator-tested-file-transfer'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  blob=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob['sha']==expected
              result[name]={'sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path('changed-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: made-tested-file-blobs
          path: changed-blobs.json
          if-no-files-found: error
          retention-days: 7
