name: Jev evidence portfolio
on:
  pull_request:
    paths:
      - 'examples/jev-poc/benchmarks/**'
      - 'examples/jev-poc/poc.py'
      - 'examples/jev-poc/adapters.py'
      - 'examples/jev-poc/madewithjev/oracle.py'
      - 'src/**'
      - 'schemas/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/benchmark-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acquire pinned public evidence without running upstream code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-evidence
          git rev-parse HEAD > target/benchmark-evidence/commit.txt
          git archive HEAD > target/benchmark-evidence/source.tar
          python3 -m pip install 'pyarrow==21.0.0'
          python3 examples/jev-poc/benchmarks/fetch.py --out target/benchmark-sources 2>&1 | tee target/benchmark-evidence/acquisition.log
          tar -czf target/benchmark-evidence/benchmark-sources.tar.gz -C target benchmark-sources
          sha256sum target/benchmark-evidence/benchmark-sources.tar.gz > target/benchmark-evidence/benchmark-sources.sha256
      - name: Build and test the actual Rust core
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          cargo fmt --all -- --check 2>&1 | tee target/benchmark-evidence/format.log
          cargo test --locked --all-targets 2>&1 | tee target/benchmark-evidence/rust-tests.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/benchmark-evidence/clippy.log
          cargo build --locked 2>&1 | tee target/benchmark-evidence/build.log
          cp target/debug/validator target/benchmark-evidence/validator
      - name: Run adapter contracts and published-response comparisons
        shell: bash
        run: |
          set -euo pipefail
          export VALIDATOR_BIN="$PWD/target/debug/validator"
          python3 -m unittest discover -s examples/jev-poc/benchmarks -p 'test_*.py' -v 2>&1 | tee target/benchmark-evidence/tests.log
          python3 examples/jev-poc/benchmarks/run.py --sources target/benchmark-sources --validator "$VALIDATOR_BIN" --allow-unverified-moderation-join --out target/benchmark-evidence/runs 2>&1 | tee target/benchmark-evidence/replay.log
      - name: Retain execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-verification
          path: target/benchmark-evidence/
          retention-days: 14
          if-no-files-found: error
